<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stream Pad</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-tab="pad">

<header>
  <span class="dot" id="dot" role="img" aria-label="Stan połączenia z OBS"></span>
  <h1>Stream Pad</h1>
  <span class="pill live" id="p-live" hidden>live</span>
  <span class="pill rec" id="p-rec" hidden>rec</span>
  <div class="stats">
    <span>CPU <b id="st-cpu">–</b></span>
    <span>FPS <b id="st-fps">–</b></span>
    <span class="opt">Gubione klatki <b id="st-drop">–</b></span>
    <span class="opt" id="st-disk-wrap">Dysk <b id="st-disk">–</b></span>
  </div>
  <button class="iconbtn" id="b-settings" type="button">Ustawienia</button>
  <a class="helplink" href="/help" target="_blank" rel="noopener">Instrukcja</a>
</header>

<div id="banner" hidden role="status">
  <span id="banner-msg"></span>
  <button class="linkbtn" id="b-banner-server" type="button">Zmień serwer</button>
</div>

<main>
  <div class="col">
    <section data-pane="pad">
      <div class="controls">
        <button class="big" id="b-stream" type="button"><span>Stream</span><small id="t-stream">wyłączony</small><small class="hint" id="h-stream"></small></button>
        <button class="big" id="b-rec" type="button"><span>Nagrywanie</span><small id="t-rec">wyłączone</small><small class="hint" id="h-rec"></small></button>
        <button class="big" id="b-replay" type="button"><span>Zapisz powtórkę</span><small>bufor powtórek</small></button>
      </div>
      <div class="msg" id="rec-dir" style="margin-top:10px"></div>
    </section>
    <section data-pane="pad">
      <h2>Sceny</h2>
      <div class="scenes" id="scenes"></div>
    </section>
    <section data-pane="audio">
      <h2>Dźwięk</h2>
      <div class="audio" id="audio"></div>
    </section>
  </div>

  <div class="col">
    <section class="chat" data-pane="chat">
      <h2>Czat na żywo (Twitch)</h2>
      <div class="chat-head">
        <input type="text" id="chan" placeholder="nazwa kanału" aria-label="Kanał Twitch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="btn ghost" id="chan-go" type="button">Połącz</button>
      </div>
      <div id="chatlog" aria-live="off"></div>
    </section>
  </div>
</main>

<nav id="tabbar" aria-label="Widoki">
  <button type="button" data-tab="pad" class="on" aria-selected="true">Pad</button>
  <button type="button" data-tab="audio" aria-selected="false">Dźwięk</button>
  <button type="button" data-tab="chat" aria-selected="false">Czat</button>
</nav>

<div id="connect" hidden>
  <div class="card">
    <h2>Połącz z OBS</h2>
    <div>
      <div class="msg" id="scan-msg">Szukam OBS w sieci…</div>
      <div class="chips" id="found"></div>
    </div>
    <input type="text" id="host" placeholder="adres IP, np. 192.168.1.20" aria-label="Adres serwera OBS" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
    <input type="password" id="pass" placeholder="hasło OBS WebSocket (jeśli ustawione)" aria-label="Hasło OBS WebSocket" autocomplete="off">
    <div class="msg" id="conn-msg"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" id="go" type="button" style="flex:1">Połącz</button>
      <button class="btn ghost" id="rescan" type="button">Szukaj ponownie</button>
    </div>
  </div>
</div>

<div class="overlay" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title">Ustawienia</h2>
      <a class="helplink" href="/help" target="_blank" rel="noopener" style="display:inline">Instrukcja</a>
      <button class="btn ghost" id="settings-close" type="button">Zamknij</button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
    <div class="sheet-foot">
      <span class="msg" id="settings-msg" role="status"></span>
      <button class="btn ghost" id="settings-cancel" type="button">Anuluj</button>
      <button class="btn" id="settings-save" type="button">Zapisz zmiany</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
